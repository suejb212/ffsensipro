<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Sensi | FF Sensi Pro</title><style>body{margin:0;background:radial-gradient(circle at top left,#172d54,#080d1c 65%);color:#edf4ff;font:16px system-ui}.wrap{max-width:760px;margin:40px auto;padding:20px}a{color:#35e5f5}.panel{background:#121a30;border:1px solid #344463;border-radius:20px;padding:28px}h1{font-size:clamp(30px,6vw,52px)}label{display:block;margin-top:16px}input,select{display:block;width:100%;box-sizing:border-box;padding:13px;margin-top:7px;background:#0b1326;color:white;border:1px solid #344463;border-radius:10px;font:inherit}button{width:100%;margin-top:25px;padding:16px;border:0;border-radius:10px;background:linear-gradient(90deg,#35e5f5,#a46aff);font-weight:800;cursor:pointer}button:disabled{opacity:.6}.muted{color:#a7b5d0}.result{margin-top:18px;white-space:pre-wrap;line-height:1.8}.hidden{display:none}</style></head><body><div class="wrap"><nav><a href="/">← Home / Free Sensi</a></nav><h1>👑 Premium Sensi</h1><p class="muted">One-time purchase • €4.99 per generation. Personalized starting recommendations; results are not guaranteed to improve gameplay.</p><section class="panel"><form id="form"><label>Phone brand<input name="brand" required maxlength="50" placeholder="e.g. Apple iPhone"></label><label>Phone model<input name="model" required maxlength="80" placeholder="e.g. iPhone 15 Pro Max"></label><label>Play style<select name="style"><option value="balanced">Balanced</option><option value="rush">Rush</option><option value="headshot">One Tap / Headshot</option><option value="sniper">Sniper</option></select></label><label>Sensitivity scale<select name="scale"><option value="200">0–200</option><option value="100">0–100</option></select></label><button id="buy">Unlock Premium — €4.99</button></form><p id="status" role="status" class="muted"></p><div id="result" class="result hidden"></div></section></div><script>const form=document.querySelector('#form'),status=document.querySelector('#status'),result=document.querySelector('#result'),buy=document.querySelector('#buy');form.addEventListener('submit',async e=>{e.preventDefault();buy.disabled=true;status.textContent='Preparing secure checkout…';try{const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok||!j.url)throw Error(j.error||'Checkout unavailable');location.href=j.url}catch(err){status.textContent=err.message;buy.disabled=false}});const order=new URLSearchParams(location.search).get('order');if(order){status.textContent='Checking payment status…';let attempts=0;const check=async()=>{try{const r=await fetch('/api/premium-result?order='+encodeURIComponent(order));const j=await r.json();if(r.status===202&&attempts++<20){status.textContent='Waiting for verified payment…';setTimeout(check,3000);return}if(!r.ok)throw Error(j.error||'Could not verify payment');status.textContent='Payment verified ✓';result.textContent=Object.entries(j.settings).map(([k,v])=>k+': '+v).join('\n');result.classList.remove('hidden')}catch(err){status.textContent=err.message}};check()}</script></body></html>
