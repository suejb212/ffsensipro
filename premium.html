<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Sensi | FF Sensi Pro</title>
<style>body{margin:0;background:radial-gradient(circle at top left,#172d54,#080d1c 65%);color:#edf4ff;font:16px system-ui}.wrap{max-width:760px;margin:40px auto;padding:20px}a{color:#35e5f5}.panel{background:#121a30;border:1px solid #344463;border-radius:20px;padding:28px}h1{font-size:clamp(30px,6vw,52px)}label{display:block;margin-top:16px}input,select{display:block;width:100%;box-sizing:border-box;padding:13px;margin-top:7px;background:#0b1326;color:white;border:1px solid #344463;border-radius:10px;font:inherit}button{width:100%;margin-top:25px;padding:16px;border:0;border-radius:10px;background:linear-gradient(90deg,#35e5f5,#a46aff);font-weight:800;cursor:pointer}button:disabled{opacity:.6}.muted{color:#a7b5d0}.result{margin-top:18px;white-space:pre-wrap;line-height:1.8}.hidden{display:none}</style>
</head>
<body><div class="wrap"><nav><a href="/">← Home / Free Sensi</a></nav><h1>👑 Premium Sensi</h1><p class="muted">👑 Unlock Premium Sensitivity for just €4.99! Get personalized settings tailored to your phone model and play style.</p>
<section class="panel"><form id="form">
<label>Phone brand<select name="brand" id="brand" required><option value="">Select phone brand</option></select></label>
<label>Phone model<select name="model" id="model" required disabled><option value="">Select a brand first</option></select></label>
<label>Play style<select name="style"><option value="balanced">Balanced</option><option value="rush">Rush</option><option value="headshot">One Tap / Headshot</option><option value="sniper">Sniper</option></select></label>
<label>Sensitivity scale<select name="scale"><option value="200">0–200</option><option value="100">0–100</option></select></label>
<button id="buy">Unlock Premium — €4.99</button></form><p id="status" role="status" class="muted"></p><div id="result" class="result hidden"></div></section></div>
<script>
const phoneModels={

  'Samsung':['Galaxy A05','Galaxy A06','Galaxy A14','Galaxy A15','Galaxy A16','Galaxy A24','Galaxy A25','Galaxy A34','Galaxy A35','Galaxy A36','Galaxy A54','Galaxy A55','Galaxy A56','Galaxy S20','Galaxy S20 FE','Galaxy S21','Galaxy S21 FE','Galaxy S21 Ultra','Galaxy S22','Galaxy S22 Plus','Galaxy S22 Ultra','Galaxy S23','Galaxy S23 FE','Galaxy S23 Plus','Galaxy S23 Ultra','Galaxy S24','Galaxy S24 FE','Galaxy S24 Plus','Galaxy S24 Ultra','Galaxy S25','Galaxy S25 Plus','Galaxy S25 Ultra','Galaxy Z Flip5','Galaxy Z Flip6','Galaxy Z Fold5','Galaxy Z Fold6'],

  'Redmi':['Redmi 9','Redmi 10','Redmi 12','Redmi 13','Redmi 14C','Redmi Note 10','Redmi Note 10 Pro','Redmi Note 11','Redmi Note 11 Pro','Redmi Note 12','Redmi Note 12 Pro','Redmi Note 13','Redmi Note 13 Pro','Redmi Note 13 Pro+','Redmi Note 14','Redmi Note 14 Pro','Redmi Note 14 Pro+'],

  'OnePlus':['OnePlus 8','OnePlus 9','OnePlus 9 Pro','OnePlus 10 Pro','OnePlus 11','OnePlus 12','OnePlus 13','OnePlus Nord 2','OnePlus Nord 3','OnePlus Nord 4','OnePlus Nord CE 3','OnePlus Nord CE 4'],
  'Google Pixel':['Pixel 6','Pixel 6 Pro','Pixel 6a','Pixel 7','Pixel 7 Pro','Pixel 7a','Pixel 8','Pixel 8 Pro','Pixel 8a','Pixel 9','Pixel 9 Pro','Pixel 9 Pro XL','Pixel 9a','Pixel 10','Pixel 10 Pro'],

  'Honor':['Honor 70','Honor 90','Honor 200','Honor 200 Pro','Honor X6','Honor X7','Honor X8','Honor X9','Honor Magic5','Honor Magic5 Pro','Honor Magic6','Honor Magic6 Pro','Honor Magic7 Pro'],

  'Infinix':['Infinix Hot 12','Infinix Hot 30','Infinix Hot 40','Infinix Hot 50','Infinix Note 12','Infinix Note 30','Infinix Note 40','Infinix GT 10 Pro','Infinix GT 20 Pro'],
  'Tecno':['Tecno Spark 10','Tecno Spark 20','Tecno Spark 30','Tecno Pova 5','Tecno Pova 6','Tecno Pova 7','Tecno Camon 20','Tecno Camon 30','Tecno Camon 40'],
  'ASUS ROG Phone':['ROG Phone 5','ROG Phone 6','ROG Phone 7','ROG Phone 8','ROG Phone 9'],
  'Nothing':['Nothing Phone (1)','Nothing Phone (2)','Nothing Phone (2a)','Nothing Phone (3a)','Nothing Phone (3a) Pro','Nothing Phone (3)']

const form=document.querySelector('#form'),status=document.querySelector('#status'),result=document.querySelector('#result'),buy=document.querySelector('#buy'),brand=document.querySelector('#brand'),model=document.querySelector('#model');
for(const name of Object.keys(phoneModels)){brand.add(new Option(name,name))}
brand.addEventListener('change',()=>{model.replaceChildren(new Option(brand.value?'Select phone model':'Select a brand first',''));for(const name of phoneModels[brand.value]||[])model.add(new Option(name,name));model.disabled=!brand.value;status.textContent=''});
form.addEventListener('submit',async e=>{e.preventDefault();const allowed=phoneModels[brand.value]||[];if(!allowed.includes(model.value)){status.textContent='Please select a valid phone model for the chosen brand.';return}buy.disabled=true;status.textContent='Preparing secure checkout…';try{const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok||!j.url)throw Error(j.error||'Checkout unavailable');location.href=j.url}catch(err){status.textContent=err.message;buy.disabled=false}});
const order=new URLSearchParams(location.search).get('order');if(order){status.textContent='Checking payment status…';let attempts=0;const check=async()=>{try{const r=await fetch('/api/premium-result?order='+encodeURIComponent(order));const j=await r.json();if(r.status===202&&attempts++<20){status.textContent='Waiting for verified payment…';setTimeout(check,3000);return}if(!r.ok)throw Error(j.error||'Could not verify payment');status.textContent='Payment verified ✓';result.textContent=Object.entries(j.settings).map(([k,v])=>k+': '+v).join('\n');result.classList.remove('hidden')}catch(err){status.textContent=err.message}};check()}
</script></body></html>
